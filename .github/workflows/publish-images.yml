name: Publish MyAccounting Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="main-$(git rev-parse --short=7 HEAD)"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        shell: bash
        env:
          REGISTRY_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN != '' && secrets.PACKAGES_READ_TOKEN || secrets.GHCR_READ_TOKEN }}
          NUGET_AUTHTOKEN: ${{ secrets.NUGET_AUTHTOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Pull shared base image with read-only package token.
          echo "${REGISTRY_READ_TOKEN}" | docker login ghcr.io -u popforge --password-stdin
          docker pull ghcr.io/popforge/base-api:10.0
          docker logout ghcr.io

          # Push cluster image with the workflow token tied to this repository.
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          DOCKER_BUILDKIT=1 docker build \
            --secret id=nuget_token,env=NUGET_AUTHTOKEN \
            -f ./src/my-accounting/server/MyAccounting.Server/Dockerfile \
            -t ghcr.io/popforge/my-accounting-api:${{ steps.meta.outputs.tag }} \
            ./src/my-accounting/server/MyAccounting.Server
          docker push ghcr.io/popforge/my-accounting-api:${{ steps.meta.outputs.tag }}

      - name: Build and push App image
        shell: bash
        env:
          REGISTRY_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN != '' && secrets.PACKAGES_READ_TOKEN || secrets.GHCR_READ_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Pull shared base image with read-only package token.
          echo "${REGISTRY_READ_TOKEN}" | docker login ghcr.io -u popforge --password-stdin
          docker pull ghcr.io/popforge/base-nginx:latest
          docker logout ghcr.io

          # Push cluster image with the workflow token tied to this repository.
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          DOCKER_BUILDKIT=1 docker build \
            --secret id=npm_token,env=NPM_TOKEN \
            -f ./src/my-accounting/app/Dockerfile \
            -t ghcr.io/popforge/my-accounting-app:${{ steps.meta.outputs.tag }} \
            ./src/my-accounting/app
          docker push ghcr.io/popforge/my-accounting-app:${{ steps.meta.outputs.tag }}

      - name: Write image-tags artifact
        shell: bash
        run: |
          cat > image-tags.env <<EOF
          API_TAG=${{ steps.meta.outputs.tag }}
          APP_TAG=${{ steps.meta.outputs.tag }}
          EOF

      - name: Upload image-tags artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tags
          path: image-tags.env
          retention-days: 1

      - name: Notify popsalon-infra (deploy)
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: popforge/popsalon-infra
          event-type: image-published
          client-payload: >-
            {"cluster":"myaccounting","tag":"${{ steps.meta.outputs.tag }}","sha":"${{ github.sha }}","ref":"${{ github.ref }}"}