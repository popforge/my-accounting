name: Publish MyAccounting Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="main-$(git rev-parse --short=7 HEAD)"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./src/my-accounting/server/MyAccounting.Server
          file: ./src/my-accounting/server/MyAccounting.Server/Dockerfile
          push: true
          tags: ghcr.io/popforge/my-accounting-api:${{ steps.meta.outputs.tag }}
          secrets: |
            nuget_token=${{ secrets.NUGET_AUTHTOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push App image
        uses: docker/build-push-action@v6
        with:
          context: ./src/my-accounting/app
          file: ./src/my-accounting/app/Dockerfile
          push: true
          tags: ghcr.io/popforge/my-accounting-app:${{ steps.meta.outputs.tag }}
          secrets: |
            npm_token=${{ secrets.NPM_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Write image-tags artifact
        shell: bash
        run: |
          cat > image-tags.env <<EOF
          API_TAG=${{ steps.meta.outputs.tag }}
          APP_TAG=${{ steps.meta.outputs.tag }}
          EOF

      - name: Upload image-tags artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tags
          path: image-tags.env
          retention-days: 1
