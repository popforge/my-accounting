name: Publish MyAccounting Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# L'artifact uploadé par le reusable s'appelle "image-tags" (contenu : image-tags.env).
# Il est téléchargé par deploy-beta.yml → job prepare-deploy sous ce même nom.
#
# Note : le reusable injecte secrets.GITHUB_TOKEN comme npm_token (BuildKit secret),
# et non secrets.NPM_TOKEN. Fonctionne si le registre npm est GitHub Packages (ghcr.io).
# Si un vrai token npmjs.com est requis, adapter le reusable ou migrer vers npm_token_as_build_arg.

jobs:
  publish:
    uses: popforge/Popforge.Shared/.github/workflows/reusable-publish-images.yml@main
    with:
      api_image_name: my-accounting-api
      api_dockerfile: ./src/my-accounting/server/MyAccounting.Server/Dockerfile
      api_context: ./src/my-accounting/server/MyAccounting.Server
      app_image_name: my-accounting-app
      app_dockerfile: ./src/my-accounting/app/Dockerfile
      app_context: ./src/my-accounting/app
      # Le Dockerfile app utilise RUN --mount=type=secret,id=npm_token (BuildKit secret)
      npm_token_as_secret: true
    secrets: inherit