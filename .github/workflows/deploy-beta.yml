name: Deploy MyAccounting to Beta

on:
  workflow_run:
    workflows: ["Publish MyAccounting Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: "Successful Publish MyAccounting Images run id"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  prepare-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: beta

    steps:
      - name: Download image tags artifact
        uses: actions/download-artifact@v4
        with:
          name: image-tags
          github-token: ${{ github.token }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_run_id || github.event.workflow_run.id }}

      - name: Load and validate image tags
        id: tags
        shell: bash
        run: |
          sed 's/^[[:space:]]*//' image-tags.env > image-tags-clean.env
          source ./image-tags-clean.env
          for tag in "${API_TAG}" "${APP_TAG}"; do
            if [[ ! "$tag" =~ ^(main|sha)-[0-9a-f]{7,40}$ && ! "$tag" =~ ^v[0-9]+(\.[0-9]+){1,2}([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid image tag: ${tag}" >&2
              exit 1
            fi
          done
          echo "api_tag=${API_TAG}" >> "${GITHUB_OUTPUT}"
          echo "app_tag=${APP_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Create deploy.env
        shell: bash
        run: |
          oidc_authority="${{ vars.MY_ACCOUNTING_OIDC_AUTHORITY }}"
          if [ -z "${oidc_authority}" ]; then
            oidc_authority="https://auth-beta.popsalon.app"
          fi
          cat > deploy.env <<EOF
          MY_ACCOUNTING_API_TAG=${{ steps.tags.outputs.api_tag }}
          MY_ACCOUNTING_APP_TAG=${{ steps.tags.outputs.app_tag }}
          MY_ACCOUNTING_HOST_BIND=127.0.0.1
          MY_ACCOUNTING_API_PORT=8095
          MY_ACCOUNTING_APP_PORT=8096
          MY_ACCOUNTING_ASPNETCORE_ENVIRONMENT=Beta
          MY_ACCOUNTING_DB_CONNECTION=${{ secrets.MY_ACCOUNTING_DB_CONNECTION }}
          MY_ACCOUNTING_OIDC_AUTHORITY=${oidc_authority}
          EOF
          sed -i 's/^[[:space:]]*//' deploy.env

      - name: Upload deploy.env artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-env-files
          path: deploy.env
          retention-days: 1

  deploy:
    needs: prepare-deploy
    runs-on: ubuntu-latest
    environment: beta
    env:
      DEPLOY_PATH: /home/${{ vars.ORACLE_SSH_USERNAME }}/my-accounting

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download deploy.env artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-env-files

      - name: Precheck SSH TCP reachability
        shell: bash
        run: |
          set -euo pipefail
          host="${{ vars.ORACLE_SSH_HOST }}"
          if [ -z "${host}" ]; then
            echo "ORACLE_SSH_HOST is empty." >&2
            exit 1
          fi
          nc -zvw5 "${host}" 22

      - name: Ensure remote deploy path exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.ORACLE_SSH_HOST }}
          username: ${{ vars.ORACLE_SSH_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          timeout: 30s
          command_timeout: 2m
          script: mkdir -p "${{ env.DEPLOY_PATH }}"

      - name: Copy deployment manifest
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.ORACLE_SSH_HOST }}
          username: ${{ vars.ORACLE_SSH_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          timeout: 30s
          source: docker-compose.deploy.yml,deploy.env
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 0

      - name: Pull and start pinned images
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.ORACLE_SSH_HOST }}
          username: ${{ vars.ORACLE_SSH_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          timeout: 30s
          command_timeout: 15m
          script: |
            cd "${{ env.DEPLOY_PATH }}"
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ vars.GHCR_READ_USERNAME }}" --password-stdin
            docker compose -f docker-compose.deploy.yml --env-file deploy.env pull
            docker compose -f docker-compose.deploy.yml --env-file deploy.env up -d
            docker image prune -f

  configure-nginx:
    needs: deploy
    runs-on: ubuntu-latest
    environment: beta

    steps:
      - name: Ensure host nginx reverse proxy for my-accounting
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.ORACLE_SSH_HOST }}
          username: ${{ vars.ORACLE_SSH_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            domain="${{ vars.MY_ACCOUNTING_BETA_DOMAIN }}"
            api_port="${{ vars.MY_ACCOUNTING_API_PORT }}"
            app_port="${{ vars.MY_ACCOUNTING_APP_PORT }}"
            domain="${domain:-my-accounting-beta.popsalon.app}"
            api_port="${api_port:-8095}"
            app_port="${app_port:-8096}"

            sudo tee "/etc/nginx/sites-available/${domain}" > /dev/null <<NGINXCONF
            server {
                listen 80;
                server_name ${domain};

                location / {
                    proxy_pass http://127.0.0.1:${app_port};
                    proxy_set_header Host \$host;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }

                location /api/ {
                    proxy_pass http://127.0.0.1:${api_port};
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }
            }
            NGINXCONF

            sudo ln -sfn "/etc/nginx/sites-available/${domain}" "/etc/nginx/sites-enabled/${domain}"
            if [ -f /etc/nginx/sites-enabled/default ]; then
              sudo rm -f /etc/nginx/sites-enabled/default
            fi
            sudo nginx -t
            sudo systemctl reload nginx

      - name: Ensure HTTPS certificate on host nginx (Certbot)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.ORACLE_SSH_HOST }}
          username: ${{ vars.ORACLE_SSH_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            certbot_email="${{ secrets.CERTBOT_EMAIL }}"
            if [ -z "${certbot_email}" ]; then
              echo "CERTBOT_EMAIL not configured, skipping certbot step."
              exit 0
            fi
            domain="${{ vars.MY_ACCOUNTING_BETA_DOMAIN }}"
            domain="${domain:-my-accounting-beta.popsalon.app}"
            if sudo test -d "/etc/letsencrypt/live/${domain}"; then
              echo "Certificate already exists for ${domain}; running renew and nginx reload."
              sudo certbot renew --non-interactive
            else
              echo "Issuing new certificate for ${domain}."
              sudo certbot --nginx -d "${domain}" --non-interactive --agree-tos -m "${certbot_email}" --redirect
            fi
            sudo nginx -t
            sudo systemctl reload nginx