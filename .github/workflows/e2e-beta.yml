name: MyAccounting E2E on Beta

on:
  workflow_run:
    workflows: ["Deploy MyAccounting to Beta"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-accounting-e2e-beta
  cancel-in-progress: false

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    uses: popforge/Popforge.Shared/.github/workflows/reusable-e2e-beta.yml@main
    with:
      working_directory: src/my-accounting/tests/e2e
      base_url: ${{ vars.MY_ACCOUNTING_BETA_BASE_URL }}
      oidc_authority: ${{ vars.MY_ACCOUNTING_OIDC_AUTHORITY }}
      oidc_client_id: my-accounting-cluster
    secrets: inherit