name: MyAccounting E2E on Beta

on:
  workflow_run:
    workflows: ["Deploy MyAccounting to Beta"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-accounting-e2e-beta
  cancel-in-progress: false

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: beta
    defaults:
      run:
        working-directory: src/my-accounting/tests/e2e
    env:
      CI: true
      BASE_URL: ${{ vars.MY_ACCOUNTING_BETA_BASE_URL }}
      OIDC_AUTHORITY: ${{ vars.MY_ACCOUNTING_OIDC_AUTHORITY }}
      OIDC_CLIENT_ID: my-accounting-cluster
      OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/my-accounting/tests/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-accounting-e2e-report
          path: src/my-accounting/tests/e2e/playwright-report
          retention-days: 7