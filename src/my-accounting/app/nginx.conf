server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers l'API Kamal (host.docker.internal requiert --add-host=host.docker.internal:host-gateway)
    location /api/ {
        proxy_pass         http://host.docker.internal:8095/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api-docs/ {
        proxy_pass         http://host.docker.internal:8095/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
}
