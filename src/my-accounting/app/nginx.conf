server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # my-accounting-app sert uniquement les fichiers statiques Vue.
    # Le routage /api/* et /health est géré par nginx VM (proxy direct vers my-accounting-api:8095).
    # Voir docs/architecture/saas-cluster-topology.md.

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Endpoint de healthcheck pour Kamal accessory healthcheck.
    location = /spa-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
