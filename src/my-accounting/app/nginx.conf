server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers l'API (service my-accounting-api dans docker-compose)
    location /api/ {
        proxy_pass         http://my-accounting-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Proxy Swagger UI (disponible en Beta uniquement via nginx)
    location /api-docs/ {
        proxy_pass         http://my-accounting-api:8080/api-docs/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }
}
