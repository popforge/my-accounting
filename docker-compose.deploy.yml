services:
  my-accounting-api:
    image: ghcr.io/popforge/my-accounting-api:${MY_ACCOUNTING_API_TAG:?MY_ACCOUNTING_API_TAG is required}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${MY_ACCOUNTING_ASPNETCORE_ENVIRONMENT:-Beta}
      ConnectionStrings__AppDb: ${MY_ACCOUNTING_DB_CONNECTION:?MY_ACCOUNTING_DB_CONNECTION is required}
      Oidc__Authority: ${MY_ACCOUNTING_OIDC_AUTHORITY:?MY_ACCOUNTING_OIDC_AUTHORITY is required}
    ports:
      - "${MY_ACCOUNTING_HOST_BIND:-127.0.0.1}:${MY_ACCOUNTING_API_PORT:-8095}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  my-accounting-app:
    image: ghcr.io/popforge/my-accounting-app:${MY_ACCOUNTING_APP_TAG:?MY_ACCOUNTING_APP_TAG is required}
    restart: unless-stopped
    ports:
      - "${MY_ACCOUNTING_HOST_BIND:-127.0.0.1}:${MY_ACCOUNTING_APP_PORT:-8096}:80"
    depends_on:
      my-accounting-api:
        condition: service_healthy
